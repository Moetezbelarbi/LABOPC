<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LABOPC — Laboratoire Virtuel</title>
<meta name="theme-color" content="#2c5364">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
<style>
  :root {
    --bg-dark: #0f2027; --bg-mid: #203a43; --bg-light: #2c5364;
    --accent: #6ee7b7; --accent-dark: #11998e;
    --text-main: #222; --text-muted: #666;
    --card-bg: #f4f8fb; --border: #d6e4f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid), var(--bg-light)); min-height: 100vh; padding: 20px; color: var(--text-main); }
  .container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); overflow: hidden; }
  header { background: linear-gradient(90deg, var(--bg-dark), var(--bg-light)); color: white; padding: calc(22px + env(safe-area-inset-top)) 30px 22px 30px; text-align: center; position: relative; }
  header h1 { font-size: 1.7rem; margin-bottom: 4px; letter-spacing: 1px; }
  header .sub { opacity: 0.8; font-size: 0.9rem; }
  header .labopc { color: var(--accent); font-weight: 700; }
  header .lang-switch { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 14px; display: flex; gap: 4px; background: rgba(255,255,255,0.12); border-radius: 20px; padding: 3px; z-index: 10; }
  header .lang-switch button { background: transparent; color: #b8d4e0; border: none; padding: 4px 12px; border-radius: 16px; font-size: 0.75rem; cursor: pointer; font-weight: 700; transition: all 0.2s; }
  header .lang-switch button.active { background: var(--accent); color: var(--bg-dark); }
  header .copyright-badge { position: absolute; top: 10px; right: 14px; font-size: 0.72rem; color: #b8d4e0; }
  main { padding: 25px 30px 40px; min-height: 50vh; }
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.35s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to {opacity:1; transform:translateY(0);} }
  h2 { color: var(--bg-dark); margin-bottom: 18px; font-size: 1.3rem; border-bottom: 3px solid var(--bg-light); padding-bottom: 8px; }
  h3 { color: var(--bg-light); margin: 18px 0 12px; font-size: 1.05rem; }
  
  .home-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .hero-card { border-radius: 16px; padding: 40px 20px; text-align: center; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; color: white; position: relative; overflow: hidden; }
  .hero-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
  .hero-card.physique { background: linear-gradient(135deg, #2980b9, #2c3e50); }
  .hero-card.chimie { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .hero-card .icon { font-size: 4rem; margin-bottom: 15px; position: relative; z-index: 2; }
  .hero-card .title { font-size: 1.8rem; font-weight: 700; position: relative; z-index: 2; }
  .hero-card .desc { font-size: 1rem; opacity: 0.9; margin-top: 5px; position: relative; z-index: 2; }

  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
  .card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.25s; text-align: center; }
  .card:hover { transform: translateY(-4px); border-color: var(--bg-light); box-shadow: 0 8px 20px rgba(44,83,100,0.25); background: #eaf4fa; }
  .card .icon { font-size: 2.5rem; margin-bottom: 10px; }
  .card .title { font-weight: 600; color: var(--bg-dark); margin-bottom: 4px; font-size: 1.1rem; }
  .card .desc { font-size: 0.85rem; color: var(--text-muted); }
  
  .btn { background: var(--bg-light); color: white; border: none; padding: 10px 22px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: background 0.2s; margin: 5px; }
  .btn:hover { background: var(--bg-dark); }
  .btn.secondary { background: #6c757d; }
  .btn.success { background: var(--accent-dark); }
  .btn.success:hover { background: #0d7a6f; }
  .btn.danger { background: #c0392b; }
  .btn.print { background: #5e35b1; }
  .btn.print:hover { background: #4527a0; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .back-bar { margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }

  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.9rem; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: center; }
  th { background: var(--bg-light); color: white; font-weight: 600; }
  tr:nth-child(even) td { background: var(--card-bg); }
  .info-box { background: #eaf4fa; border-left: 4px solid var(--bg-light); padding: 12px 16px; border-radius: 6px; margin: 15px 0; font-size: 0.92rem; }
  .result-box { background: linear-gradient(90deg, #d4f5e9, #b8ecdd); border: 2px solid var(--accent-dark); padding: 18px; border-radius: 10px; margin-top: 18px; }
  .result-box .big { font-size: 1.4rem; font-weight: 700; color: #0d7a6f; margin: 6px 0; }
  .warning-box { background: #fff3cd; border-left: 4px solid #f0ad4e; padding: 12px 16px; border-radius: 6px; margin: 15px 0; font-size: 0.9rem; }

  canvas { width: 100%; max-width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; display: block; }
  .sim-layout { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
  .montage-frame { background: linear-gradient(180deg, #f0f4f8 0%, #dce5ee 100%); border-radius: 14px; padding: 20px 30px; box-shadow: inset 0 0 30px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.08); position: relative; }
  .controls-panel { flex: 1; min-width: 280px; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
  .live-readout { background: #0a1a12; border-radius: 8px; padding: 12px 20px; font-family: 'Courier New', monospace; color: var(--accent); font-size: 1.5rem; font-weight: 700; text-align: center; letter-spacing: 2px; box-shadow: inset 0 0 15px rgba(110,231,183,0.2); }
  .live-readout .lbl { font-size: 0.7rem; color: var(--accent); opacity: 0.7; letter-spacing: 1px; margin-bottom: 2px; }
  .input-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .input-group label { font-weight: 600; color: var(--bg-dark); }
  .input-group input, .input-group select { padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 0.95rem; }
  .method-badge { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 10px; background: #e3f2fd; color: #1565c0; }

  .steps-container { background: #f8fafc; border: 2px solid var(--bg-light); border-radius: 12px; padding: 20px 24px; margin-top: 18px; }
  .steps-container h3 { color: var(--bg-dark); margin: 0 0 16px 0; font-size: 1.15rem; border-bottom: 2px solid var(--bg-light); padding-bottom: 10px; }
  .step-item { display: flex; gap: 14px; margin-bottom: 16px; align-items: flex-start; }
  .step-number { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--bg-light); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; }
  .step-body { flex: 1; }
  .step-title { font-weight: 700; color: var(--bg-dark); margin-bottom: 6px; font-size: 0.95rem; }
  .step-formula { font-family: 'Cambria Math', 'Times New Roman', serif; font-style: italic; font-size: 1.05rem; background: #eef4f8; border-left: 3px solid var(--bg-light); padding: 8px 14px; border-radius: 4px; margin: 6px 0; color: var(--bg-dark); overflow-x: auto; }
  .step-calc { font-family: 'Courier New', monospace; font-size: 0.95rem; background: #fff8e1; border-left: 3px solid #e67e22; padding: 8px 14px; border-radius: 4px; margin: 6px 0; color: #333; }

  footer.app-footer { background: var(--bg-dark); color: #b8d4e0; text-align: center; padding: 14px 20px; font-size: 0.8rem; border-top: 3px solid var(--accent); }
  footer.app-footer .brand { color: var(--accent); font-weight: 700; }

  @media print {
    body { background: #fff !important; padding: 0 !important; }
    .container { box-shadow: none !important; border-radius: 0 !important; max-width: 100% !important; }
    header, footer, .back-bar, .btn, .no-print { display: none !important; }
    .screen { display: none !important; }
    .screen.active { display: block !important; }
    canvas { border: 1px solid #999 !important; page-break-inside: avoid; }
    h2, h3 { color: #000 !important; border-color: #333 !important; }
    .info-box, .result-box, .warning-box, .steps-container { background: #f4f4f4 !important; border: 1px solid #999 !important; box-shadow: none !important; page-break-inside: avoid; }
  }
  .montage-frame { flex: 0 0 auto; max-width: 100%; }
  .montage-frame svg { width: 300px; max-width: 100%; height: auto; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="lang-switch">
      <button id="lang-fr" class="active" onclick="setLang('fr')">FR</button>
      <button id="lang-en" onclick="setLang('en')">EN</button>
    </div>
    <div class="copyright-badge">© M.Belarbi</div>
    <h1>🧪 <span class="labopc">LABOPC</span> by M.Belarbi</h1>
    <p class="sub" id="hdr-sub">Laboratoire virtuel de Physique-Chimie</p>
  </header>
  <main id="app-main"></main>
  <footer class="app-footer"><div><span class="brand">LABOPC</span> by M.Belarbi</div></footer>
</div>

<script>
/* ============================================================
   1. CORE & TRADUCTIONS
   ============================================================ */
const TRANSLATIONS = {
  fr: { chooseActivity: "Activité", backHome: "← Accueil", backTheme: "← Retour", print: "🖨️ Imprimer",
    activities: {
      spectro: { title: "Spectrophotométrie", desc: "Dosage par étalonnage" }, conducto: { title: "Conductimétrie", desc: "Dosage par étalonnage" }, titrage: { title: "Titrages", desc: "pH, Conducto, Colorimétrie" },
      dissolution: { title: "Dissolution / Dilution", desc: "Préparation de solutions" }, nomenclature: { title: "Nomenclature", desc: "Chimie organique" }, synthese: { title: "Synthèse Organique", desc: "Rendement" },
      boyle: { title: "Loi de Boyle-Mariotte", desc: "Gaz" }, electricite: { title: "Générateur et rendement", desc: "Énergie électrique" }, avancement: { title: "Avancement et cinétique", desc: "Suivi temporel" }, chute: { title: "Chute libre", desc: "Mécanique" }, diffraction: { title: "Diffraction", desc: "Ondes lumineuses" },
      interferences: { title: "Interférences", desc: "Fentes de Young" }, doppler: { title: "Effet Doppler", desc: "Fréquence" }, lentille: { title: "Lentille mince", desc: "Optique" },
      lunette: { title: "Lunette astronomique", desc: "Grossissement" }, venturi: { title: "Effet Venturi", desc: "Mécanique des fluides" }, archimede: { title: "Poussée d'Archimède", desc: "Flottabilité" }
    }
  },
  en: { chooseActivity: "Activity", backHome: "← Home", backTheme: "← Back", print: "🖨️ Print",
    activities: {
      spectro: { title: "Spectrophotometry", desc: "Calibration assay" }, conducto: { title: "Conductometry", desc: "Calibration assay" }, titrage: { title: "Titrations", desc: "pH, Conducto, Colorimetry" },
      dissolution: { title: "Dissolution / Dilution", desc: "Solution preparation" }, nomenclature: { title: "Nomenclature", desc: "Organic chemistry" }, synthese: { title: "Organic Synthesis", desc: "Yield" },
      boyle: { title: "Boyle-Mariotte Law", desc: "Gas" }, electricite: { title: "Generator and efficiency", desc: "Electrical energy" }, avancement: { title: "Progress and kinetics", desc: "Time monitoring" }, chute: { title: "Free Fall", desc: "Mechanics" }, diffraction: { title: "Diffraction", desc: "Light waves" },
      interferences: { title: "Interferences", desc: "Young's slits" }, doppler: { title: "Doppler Effect", desc: "Frequency" }, lentille: { title: "Thin Lens", desc: "Optics" },
      lunette: { title: "Telescope", desc: "Magnification" }, venturi: { title: "Venturi Effect", desc: "Fluid mechanics" }, archimede: { title: "Archimedes", desc: "Buoyancy" }
    }
  }
};

let currentLang = 'fr', currentDomain = null;
let activeCleanup = null;
const appMain = document.getElementById('app-main');

function t(key) { if (key.includes('.')) { const [s, p] = key.split('.'); return TRANSLATIONS[currentLang][s]?.[p] || key; } return TRANSLATIONS[currentLang][key] || key; }
function setLang(lang) { currentLang = lang; document.getElementById('lang-fr').classList.toggle('active', lang === 'fr'); document.getElementById('lang-en').classList.toggle('active', lang === 'en'); renderHome(); }
function clearMain() { if (activeCleanup) { try { activeCleanup(); } catch(e){} activeCleanup = null; } appMain.innerHTML = ''; }

function renderHome() { 
  clearMain(); 
  appMain.innerHTML = `
    <div class="screen active">
      <h2 style="text-align:center; border:none;">Choisissez une discipline</h2>
      <div class="home-hero">
        <div class="hero-card physique" onclick="selectDomain('physique')">
          <div class="icon">⚛️</div>
          <div class="title">Physique</div>
          <div class="desc">Mécanique, ondes, optique, fluides</div>
        </div>
        <div class="hero-card chimie" onclick="selectDomain('chimie')">
          <div class="icon">⚗️</div>
          <div class="title">Chimie</div>
          <div class="desc">Solutions, titrages, synthèse</div>
        </div>
      </div>
    </div>
  `; 
}

function selectDomain(domain) { currentDomain = domain; renderActivities(); }

function renderActivities() { 
  clearMain(); 
  const acts = Object.keys(REGISTRY).filter(k => REGISTRY[k].domain === currentDomain); 
  let html = `<div class="screen active"><div class="back-bar"><button class="btn secondary" onclick="renderHome()">${t('backHome')}</button></div><h2>${currentDomain === 'physique' ? '⚛️ Physique' : '⚗️ Chimie'} — ${t('chooseActivity')}</h2><div class="choices">`; 
  acts.forEach(id => { 
    const act = REGISTRY[id]; const actT = t('activities.' + id); 
    html += `<div class="card" onclick="startActivity('${id}')"><div class="icon">${act.icon || '🔬'}</div><div class="title">${actT.title}</div><div class="desc">${actT.desc}</div></div>`; 
  }); 
  html += `</div></div>`; appMain.innerHTML = html; 
}

function startActivity(id) { 
  const act = REGISTRY[id]; if (!act) return; 
  clearMain(); 
  const container = document.createElement('div'); container.className = 'screen active'; 
  const backBtn = document.createElement('div'); backBtn.className = 'back-bar'; 
  backBtn.innerHTML = `<button class="btn secondary no-print" onclick="renderActivities()">${t('backTheme')}</button><button class="btn print no-print" onclick="window.print()">${t('print')}</button>`; 
  container.appendChild(backBtn); 
  const title = document.createElement('h2'); title.innerHTML = `<span class="method-badge">${currentDomain === 'physique' ? 'Physique' : 'Chimie'}</span> ${t('activities.' + id).title}`; 
  container.appendChild(title); 
  const moduleDiv = document.createElement('div'); container.appendChild(moduleDiv); appMain.appendChild(container); 
  activeCleanup = act.render(moduleDiv, currentLang); 
}

/* ============================================================
   2. REGISTRE DES ACTIVITÉS
   ============================================================ */
function etalonnage(container, cfg) {
  const $ = (s) => container.querySelector(s), spec = cfg.mode === 'spec', sup = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const nz = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
  const fr = (v, d) => v.toFixed(d).replace('.', ',');
  const sci = (x, d) => { if (!x) return '0'; const e = Math.floor(Math.log10(Math.abs(x))); if (e >= -2 && e <= 2) return fr(+x.toPrecision(d), Math.max(0, d - 1 - e)); return fr(x / Math.pow(10, e), d - 1) + '×10' + String(e).replace('-', '⁻').replace(/\d/g, (c) => sup[c]); };
  const tf = (v) => v === 0 ? '0' : Math.abs(v) < 0.01 ? sci(v, 2) : String(+v.toPrecision(3)).replace('.', ',');
  const num = (sel, d) => { const v = parseFloat($(sel).value.replace(',', '.')); return isNaN(v) ? d : v; };
  let st = null;
  const resize = () => { if (st) { draw(); spectrum(); } };
  window.addEventListener('resize', resize);
  function plot(cv, o) {
    const r = window.devicePixelRatio || 1, W = cv.clientWidth || 600, H = 260; cv.width = W * r; cv.height = H * r; cv.style.height = H + 'px';
    const g = cv.getContext('2d'); g.setTransform(r, 0, 0, r, 0, 0); g.clearRect(0, 0, W, H); g.font = '12px sans-serif'; g.lineWidth = 1;
    const X = (v) => 62 + (v - o.x0) / (o.x1 - o.x0) * (W - 78), Y = (v) => H - 40 - (v - o.y0) / (o.y1 - o.y0) * (H - 55);
    for (let i = 0; i <= 5; i++) {
      const xv = o.x0 + (o.x1 - o.x0) * i / 5, yv = o.y0 + (o.y1 - o.y0) * i / 5; g.strokeStyle = '#d6e4f0'; g.beginPath(); g.moveTo(X(xv), 12); g.lineTo(X(xv), H - 40); g.moveTo(62, Y(yv)); g.lineTo(W - 16, Y(yv)); g.stroke();
      g.fillStyle = '#555'; g.textAlign = 'center'; g.fillText(tf(xv), X(xv), H - 24); g.textAlign = 'right'; g.fillText(tf(yv), 56, Y(yv) + 4);
    }
    g.fillStyle = '#222'; g.textAlign = 'center'; g.fillText(o.xl, W / 2, H - 6); g.save(); g.translate(12, H / 2); g.rotate(-Math.PI / 2); g.fillText(o.yl, 0, 0); g.restore();
    (o.ser || []).forEach((s) => { g.strokeStyle = g.fillStyle = s.c; g.lineWidth = 2; g.setLineDash(s.dash || []);
      if (s.line) { g.beginPath(); s.p.forEach((q, i) => g[i ? 'lineTo' : 'moveTo'](X(q[0]), Y(q[1]))); g.stroke(); }
      if (s.dots) s.p.forEach((q) => { g.beginPath(); g.arc(X(q[0]), Y(q[1]), 4, 0, 7); g.fill(); }); g.setLineDash([]); });
  }
  function menu() {
    st = null;
    container.innerHTML = '<h3>Choisissez la solution à doser</h3><div class="choices">' + cfg.sols.map((s, i) => '<div class="card" data-i="' + i + '"><div class="icon" style="color:' + (s.col || '#2c5364') + '">●</div><div class="title">' + s.n + '</div></div>').join('') + '</div>';
    container.querySelectorAll('.card').forEach((c) => c.addEventListener('click', () => work(cfg.sols[+c.dataset.i])));
  }
  function work(s) {
    st = { s, rows: [], blank: !spec, off: (Math.random() < .5 ? -1 : 1) * (0.02 + 0.03 * Math.random()), lam: 550, th: 22, cal: spec, kerr: (Math.random() < .5 ? 0.86 : 1.12) + 0.03 * Math.random(), cu: s.stock * Math.max(...s.vols) / s.vf * (0.3 + 0.55 * Math.random()), scan: false, un: null };
    const n = s.vols.length;
    container.innerHTML = '<div class="back-bar"><button class="btn secondary" id="bk">← Solutions</button></div><h3>' + s.n + '</h3>' +
      '<div class="info-box">Solution mère : ' + sci(s.stock, 3) + ' mol/L. Prépare ' + n + ' fioles jaugées de ' + s.vf + ' mL en choisissant le volume de solution mère prélevé (pipette jaugée). Les volumes proposés sont modifiables.</div>' +
      (spec ? '<div class="input-group"><label>λ (nm) :</label><input type="range" id="lam" min="400" max="900" step="5" value="550" style="width:200px"><b id="lamv">550</b><button class="btn" id="scan">Tracer le spectre</button><button class="btn" id="blank">Blanc (autozéro)</button></div><canvas id="sp"></canvas>' :
        '<div class="input-group"><label>Température θ (°C) :</label><input type="text" id="th" inputmode="decimal" value="22"><button class="btn" id="calib">Étalonner la cellule (KCl 0,0100 mol/L)</button></div>') +
      '<div id="msg"></div><div class="tw"><table><tr><th>Fiole</th><th>V mère (mL)</th><th>C (mol/L)</th><th>' + (spec ? 'A' : 'σ (mS/cm)') + '</th><th>' + (spec ? 'λ (nm)' : 'θ (°C)') + '</th><th></th></tr>' +
      s.vols.map((v, i) => '<tr><td>' + (i + 1) + '</td><td><input type="text" inputmode="decimal" id="v' + i + '" value="' + v + '" style="width:70px"></td><td id="c' + i + '">—</td><td id="y' + i + '">—</td><td id="x' + i + '">—</td><td><button class="btn success" data-m="' + i + '">Mesurer</button></td></tr>').join('') +
      '<tr><td>Inconnue</td><td colspan="2">solution à doser</td><td id="yu">—</td><td id="xu">—</td><td><button class="btn success" id="mu">Mesurer</button></td></tr></table></div>' +
      '<canvas id="cv"></canvas><p id="mod" class="small"></p>' +
      '<div class="input-group"><label>Valeur mesurée pour l’inconnue :</label><input type="text" id="yin" inputmode="decimal"><button class="btn success" id="calc">Calculer C</button></div><div id="res"></div>';
    $('#bk').addEventListener('click', menu);
    container.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => meas(+b.dataset.m)));
    $('#mu').addEventListener('click', measU); $('#calc').addEventListener('click', calc);
    if (spec) {
      $('#lam').addEventListener('input', () => { if (!st) return; st.lam = +$('#lam').value; $('#lamv').textContent = st.lam; spectrum(); });
      $('#lam').addEventListener('change', () => { if (!st) return; clear(); note('Longueur d’onde modifiée : les mesures sont à refaire.'); });
      $('#scan').addEventListener('click', () => { if (!st) return; st.scan = true; spectrum(); });
      $('#blank').addEventListener('click', () => { if (!st) return; st.blank = true; clear(); note('Blanc réalisé avec la cuve d’eau distillée (ℓ = 1,00 cm).'); });
    } else $('#calib').addEventListener('click', () => { if (!st) return; st.cal = true; clear(); const th = num('#th', 22); note('Cellule étalonnée : σ de référence du KCl 0,0100 mol/L = ' + fr(1.413 * (1 + 0.0195 * (th - 25)), 3) + ' mS/cm à ' + fr(th, 1) + ' °C.'); });
    draw(); spectrum();
  }
