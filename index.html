<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh; padding: 20px; color: #222;
  }
  .container {
    max-width: 1100px; margin: 0 auto; background: #fff;
    border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); overflow: hidden;
  }
  header {
    background: linear-gradient(90deg, #0f2027, #2c5364);
    color: white; padding: 22px 30px; text-align: center; position: relative;
  }
  header h1 { font-size: 1.7rem; margin-bottom: 4px; letter-spacing: 1px; }
  header .sub { opacity: 0.8; font-size: 0.9rem; }
  header .labopc { color: #6ee7b7; font-weight: 700; }
  header .copyright-badge {
    position: absolute; top: 10px; right: 14px;
    font-size: 0.72rem; color: #b8d4e0; opacity: 0.85;
  }
  header .lang-switch {
    position: absolute; top: 10px; left: 14px;
    display: flex; gap: 4px; background: rgba(255,255,255,0.12);
    border-radius: 20px; padding: 3px;
  }
  header .lang-switch button {
    background: transparent; color: #b8d4e0; border: none;
    padding: 4px 12px; border-radius: 16px; font-size: 0.75rem;
    cursor: pointer; font-weight: 700; transition: all 0.2s;
  }
  header .lang-switch button.active { background: #6ee7b7; color: #0f2027; }
  main { padding: 25px 30px 40px; }
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.35s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to {opacity:1; transform:translateY(0);} }

  h2 { color: #0f2027; margin-bottom: 18px; font-size: 1.3rem; border-bottom: 3px solid #2c5364; padding-bottom: 8px; }
  h3 { color: #2c5364; margin: 18px 0 12px; font-size: 1.05rem; }

  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 15px; margin-top: 20px; }
  .card {
    background: #f4f8fb; border: 2px solid #d6e4f0; border-radius: 12px;
    padding: 20px; cursor: pointer; transition: all 0.25s; text-align: center;
  }
  .card:hover { transform: translateY(-4px); border-color: #2c5364; box-shadow: 0 8px 20px rgba(44,83,100,0.25); background: #eaf4fa; }
  .card .icon { font-size: 2.2rem; margin-bottom: 8px; }
  .card .title { font-weight: 600; color: #0f2027; margin-bottom: 4px; }
  .card .desc { font-size: 0.85rem; color: #555; }

  .btn {
    background: #2c5364; color: white; border: none; padding: 10px 22px;
    border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600;
    transition: background 0.2s; margin: 5px;
  }
  .btn:hover { background: #0f2027; }
  .btn.secondary { background: #6c757d; }
  .btn.secondary:hover { background: #495057; }
  .btn.success { background: #11998e; }
  .btn.success:hover { background: #0d7a6f; }
  .btn.warning { background: #e67e22; }
  .btn.warning:hover { background: #ca6f1e; }
  .btn.danger { background: #c0392b; }
  .btn.danger:hover { background: #a93226; }
  .btn.print { background: #5e35b1; }
  .btn.print:hover { background: #4527a0; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .back-bar { margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }

  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.9rem; }
  th, td { border: 1px solid #d6e4f0; padding: 7px 10px; text-align: center; }
  th { background: #2c5364; color: white; font-weight: 600; }
  tr:nth-child(even) td { background: #f4f8fb; }

  .cond-evolution-table {
    width: 100%; border-collapse: collapse; margin: 14px 0;
    font-size: 0.88rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .cond-evolution-table th {
    background: linear-gradient(180deg, #2c5364, #1f3a4a);
    color: white; padding: 10px 12px; font-weight: 700;
    text-align: left; font-size: 0.85rem;
  }
  .cond-evolution-table td {
    border: 1px solid #d6e4f0; padding: 10px 12px;
    vertical-align: top; text-align: left; line-height: 1.5;
  }
  .cond-evolution-table tr.phase-before td { background: #eaf4fa; }
  .cond-evolution-table tr.phase-eq td {
    background: linear-gradient(90deg, #d4f5e9, #b8ecdd);
    border: 2px solid #11998e;
  }
  .cond-evolution-table tr.phase-after td { background: #fff8e1; }
  .cond-evolution-table .phase-label { font-weight: 700; color: #0f2027; font-size: 0.95rem; white-space: nowrap; }
  .cond-evolution-table .phase-badge {
    display: inline-block; padding: 2px 10px; border-radius: 12px;
    font-size: 0.72rem; font-weight: 700; margin-bottom: 4px;
  }
  .badge-before { background: #2c5364; color: white; }
  .badge-eq { background: #11998e; color: white; }
  .badge-after { background: #e67e22; color: white; }
  .cond-evolution-table .ion-up { color: #11998e; font-weight: 700; }
  .cond-evolution-table .ion-down { color: #c0392b; font-weight: 700; }
  .cond-evolution-table .ion-const { color: #6c757d; font-weight: 600; }
  .cond-evolution-table .curve-icon {
    display: inline-block; font-family: monospace;
    font-size: 1.1rem; font-weight: 700; color: #2c5364;
  }
  .sigma-evol { font-weight: 700; font-size: 0.95rem; }
  .sigma-evol.up { color: #11998e; }
  .sigma-evol.down { color: #c0392b; }
  .sigma-evol.min { color: #5e35b1; }
  .cond-note {
    background: #f8fafc; border-left: 4px solid #5e35b1;
    padding: 10px 14px; border-radius: 6px; margin: 12px 0;
    font-size: 0.88rem; color: #333;
  }
  .cond-note strong { color: #5e35b1; }

  .info-box {
    background: #eaf4fa; border-left: 4px solid #2c5364;
    padding: 12px 16px; border-radius: 6px; margin: 15px 0; font-size: 0.92rem;
  }
  .result-box {
    background: linear-gradient(90deg, #d4f5e9, #b8ecdd); border: 2px solid #11998e;
    padding: 18px; border-radius: 10px; margin-top: 18px;
  }
  .result-box .big { font-size: 1.4rem; font-weight: 700; color: #0d7a6f; margin: 6px 0; }
  .warning-box { background: #fff3cd; border-left: 4px solid #f0ad4e; padding: 12px 16px; border-radius: 6px; margin: 15px 0; font-size: 0.9rem; }
  .success-box { background: #d4f5e9; border-left: 4px solid #11998e; padding: 12px 16px; border-radius: 6px; margin: 15px 0; font-size: 0.9rem; }

  .steps-container {
    background: #f8fafc; border: 2px solid #2c5364;
    border-radius: 12px; padding: 20px 24px; margin-top: 18px;
  }
  .steps-container h3 {
    color: #0f2027; margin: 0 0 16px 0; font-size: 1.15rem;
    border-bottom: 2px solid #2c5364; padding-bottom: 10px;
  }
  .step-item { display: flex; gap: 14px; margin-bottom: 16px; align-items: flex-start; }
  .step-number {
    flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
    background: #2c5364; color: white; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 0.95rem;
  }
  .step-body { flex: 1; }
  .step-title { font-weight: 700; color: #0f2027; margin-bottom: 6px; font-size: 0.95rem; }
  .step-formula {
    font-family: 'Cambria Math', 'Times New Roman', serif;
    font-style: italic; font-size: 1.05rem;
    background: #eef4f8; border-left: 3px solid #2c5364;
    padding: 8px 14px; border-radius: 4px; margin: 6px 0;
    color: #0f2027; overflow-x: auto;
  }
  .step-calc {
    font-family: 'Courier New', monospace; font-size: 0.95rem;
    background: #fff8e1; border-left: 3px solid #e67e22;
    padding: 8px 14px; border-radius: 4px; margin: 6px 0;
    color: #333;
  }
  .step-note { font-size: 0.85rem; color: #555; margin-top: 4px; font-style: italic; }
  .final-result {
    background: linear-gradient(90deg, #d4f5e9, #b8ecdd);
    border: 2px solid #11998e; border-radius: 10px;
    padding: 16px 20px; margin-top: 16px; text-align: center;
  }
  .final-result .lbl { font-size: 0.9rem; color: #0d7a6f; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .final-result .value { font-size: 1.6rem; font-weight: 700; color: #0d7a6f; margin: 6px 0; }
  .final-result .check { font-size: 0.85rem; color: #555; margin-top: 6px; }
  .conclusion-box {
    background: #eaf4fa; border-left: 4px solid #2c5364;
    padding: 14px 18px; border-radius: 6px; margin-top: 14px;
    font-size: 0.95rem; line-height: 1.6;
  }

  canvas { max-width: 100%; background: #fff; border: 1px solid #d6e4f0; border-radius: 8px; margin: 10px 0; display: block; }

  .input-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .input-group label { font-weight: 600; color: #0f2027; }
  .input-group input, .input-group select {
    padding: 8px 12px; border: 2px solid #d6e4f0; border-radius: 8px;
    font-size: 0.95rem; width: 150px;
  }
  .input-group input:focus, .input-group select:focus { outline: none; border-color: #2c5364; }
  .unit { color: #666; font-size: 0.9rem; }

  .method-badge {
    display: inline-block; padding: 4px 14px; border-radius: 20px;
    font-size: 0.8rem; font-weight: 600; margin-bottom: 10px;
  }
  .badge-spectro { background: #e3f2fd; color: #1565c0; }
  .badge-conducto { background: #fff8e1; color: #e65100; }
  .badge-titrage { background: #fce4ec; color: #ad1457; }

  .small { font-size: 0.85rem; color: #666; }
  .latex { font-style: italic; font-family: 'Cambria Math', Georgia, serif; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .center { text-align: center; }

  .sim-layout { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
  .montage-frame {
    background: linear-gradient(180deg, #f0f4f8 0%, #dce5ee 100%);
    border-radius: 14px; padding: 20px 30px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.08);
  }
  .montage-svg { display: block; max-width: 100%; height: auto; }
  .controls-panel { flex: 1; min-width: 280px; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
  .robinet-btn {
    background: linear-gradient(180deg, #8b9aa8, #5a6b7a); color: white; border: none;
    padding: 14px 20px; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 700;
    box-shadow: 0 4px 0 #3a4a58, 0 6px 12px rgba(0,0,0,0.2);
    transition: all 0.1s; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .robinet-btn:hover { background: linear-gradient(180deg, #9aabb9, #6a7b8a); }
  .robinet-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a4a58, 0 3px 6px rgba(0,0,0,0.2); }
  .robinet-btn.open {
    background: linear-gradient(180deg, #1abc9c, #0d7a6f);
    box-shadow: 0 4px 0 #0a5a52, 0 0 20px rgba(26,188,156,0.5);
  }
  .robinet-btn .led {
    width: 12px; height: 12px; border-radius: 50%;
    background: #444; box-shadow: inset 0 0 4px rgba(0,0,0,0.5); transition: all 0.3s;
  }
  .robinet-btn.open .led {
    background: #6ee7b7; box-shadow: 0 0 12px #6ee7b7, inset 0 0 4px rgba(255,255,255,0.5);
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  .live-readout {
    background: #0a1a12; border-radius: 8px; padding: 12px 20px;
    font-family: 'Courier New', monospace; color: #6ee7b7;
    font-size: 1.5rem; font-weight: 700; text-align: center;
    letter-spacing: 2px; box-shadow: inset 0 0 15px rgba(110,231,183,0.2);
  }
  .live-readout .lbl { font-size: 0.7rem; color: #6ee7b7; opacity: 0.7; letter-spacing: 1px; margin-bottom: 2px; }
  .vol-control { text-align: center; }
  .vol-control input[type=range] { width: 100%; }

  .instru-area { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
  .spectro-device {
    width: 340px; height: 200px; background: linear-gradient(180deg, #4a5a6a, #2c3e50);
    border-radius: 14px; position: relative; padding: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .spectro-screen {
    background: #0a1a12; border: 2px solid #1a4a3a; border-radius: 6px;
    padding: 8px 14px; color: #6ee7b7; font-family: 'Courier New', monospace;
    font-size: 1.4rem; font-weight: 700; text-align: right;
    box-shadow: inset 0 0 10px rgba(110,231,183,0.3); min-width: 150px;
  }
  .spectro-screen .unit { font-size: 0.7rem; color: #6ee7b7; opacity: 0.7; text-align: left; }
  .spectro-slot {
    position: absolute; top: 50%; left: 20px; transform: translateY(-50%);
    width: 20px; height: 80px; background: #111;
    border-radius: 4px; border: 2px solid #555;
    display: flex; align-items: center; justify-content: center;
  }
  .cuve {
    width: 18px; height: 40px; border: 2px solid #ccc; border-radius: 2px;
    position: relative; background: transparent; overflow: hidden;
    transition: transform 0.5s ease;
  }
  .cuve .liquid { position: absolute; bottom: 0; left: 0; right: 0; height: 70%; transition: background 0.3s; }
  .cuve.outside { transform: translateX(-120px); }
  .beam {
    position: absolute; top: 50%; left: 40px; right: 80px; height: 4px;
    background: linear-gradient(90deg, transparent, #ffeb3b, #ffeb3b, transparent);
    transform: translateY(-50%); opacity: 0;
    transition: opacity 0.3s; box-shadow: 0 0 12px #ffeb3b;
  }
  .beam.on { opacity: 0.9; animation: beamPulse 1s ease-in-out infinite; }
  @keyframes beamPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

  .conducto-device {
    width: 340px; height: 220px; background: linear-gradient(180deg, #4a4a4a, #2a2a2a);
    border-radius: 14px; position: relative; padding: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .conducto-screen {
    background: #0a0a1a; border: 2px solid #1a2a4a; border-radius: 6px;
    padding: 8px 14px; color: #64b5f6; font-family: 'Courier New', monospace;
    font-size: 1.4rem; font-weight: 700; text-align: right;
    box-shadow: inset 0 0 10px rgba(100,181,246,0.3); min-width: 150px;
  }
  .beaker-for-probe {
    width: 120px; height: 90px; border: 3px solid #7a8fa3; border-top: none;
    border-radius: 0 0 14px 14px; position: relative; overflow: hidden;
    background: #fafafa; margin-top: 10px;
  }
  .beaker-for-probe .liquid { position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: #b3e5fc; }
  .probe-container {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    transition: transform 0.6s ease; z-index: 2;
  }
  .probe-container.dipped { transform: translateX(-50%) translateY(40px); }

  .unknown-cuve-btn {
    border: 2px dashed #e65100 !important; background: #fff3e0 !important;
    color: #e65100 !important; font-weight: 700 !important;
  }
  .unknown-cuve-btn:hover { background: #ffe0b2 !important; }

  footer.app-footer {
    background: #0f2027; color: #b8d4e0;
    text-align: center; padding: 14px 20px;
    font-size: 0.8rem; letter-spacing: 0.3px;
    border-top: 3px solid #6ee7b7;
  }
  footer.app-footer .brand { color: #6ee7b7; font-weight: 700; }
  footer.app-footer .sep { opacity: 0.5; margin: 0 6px; }
  footer.app-footer .tiny { display: block; margin-top: 4px; font-size: 0.7rem; opacity: 0.6; }

  /* ============ PWA SPLASH SCREEN ============ */
  #pwa-splash {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font
